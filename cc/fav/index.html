<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="인스타 검색 귀찮아서 만든 모음집">
  <title>바로가기 모음</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f7f7f8;
      --surface: #ffffff;
      --text: #18181b;
      --muted: #71717a;
      --line: #e4e4e7;
      --accent: #d62976;
      --accent-dark: #a51d5a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    main.container {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .profile-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgb(24 24 27 / 5%);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .profile-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 30px rgb(24 24 27 / 10%);
    }

    .profile-handle {
      margin: 0;
      color: var(--muted);
      font-size: .92rem;
    }

    .profile-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 34px;
      #margin-top: 24px;
      border-radius: 10px;
      background: var(--text);
      color: #fff;
      font-size: .92rem;
      font-weight: 700;
      text-decoration: none;
      transition: background .2s ease;
    }

    .profile-link:hover,
    .profile-link:focus-visible { background: var(--accent-dark); }

    .profile-link:focus-visible { outline: 3px solid #f7a8c8; outline-offset: 3px; }

    footer {
      order: -1;
      padding: 32px 0 0;
      color: var(--muted);
      font-size: .85rem;
      text-align: center;
    }

    @media (max-width: 800px) {
      .profile-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      header { padding-top: 48px; }
    }

    @media (max-width: 520px) {
      .container { width: min(100% - 24px, 420px); }
      header { padding: 40px 0 28px; }
      .profile-grid { grid-template-columns: 1fr; gap: 14px; padding-bottom: 30%; }
      #.profile-card { min-height: 170px; padding: 20px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="profile-grid" aria-label="목록">
	  <article class="profile-card">
        <a class="profile-link" href="https://www.instagram.com/kyoko_kuroheart/" target="_blank" rel="noopener noreferrer">쿄코 / @kyoko_kuroheart</a>
      </article>
	  <article class="profile-card">
        <a class="profile-link" href="https://www.instagram.com/dreammaid_ume/" target="_blank" rel="noopener noreferrer">우메 / @dreammaid_ume</a>
      </article>
	  <article class="profile-card">
        <a class="profile-link" href="https://www.instagram.com/mainichi.yochi/" target="_blank" rel="noopener noreferrer">요치 / @mainichi.yochi</a>
      </article>
	  <article class="profile-card">
	  <p class="profile-handle">독이 들어있어서 중독되기 쉽다. 난 이미 중독됨.</p>
		<a class="profile-link" href="https://www.instagram.com/yume.kinoko/" target="_blank" rel="noopener noreferrer" onclick="return handleDubleTap(event, this)">🍄키노코🍄 누나 / @yume.kinoko</a>
      </article>
	  <article class="profile-card">
	  <p class="profile-handle">평소에도 빛나지만 코스프레를 하면 눈부신 그녀</p>
        <a class="profile-link" href="https://www.instagram.com/yume.potato/" target="_blank" rel="noopener noreferrer" onclick="return handleDubleTap(event, this)">🥔감자🥔 / @yume.potato</a>
      </article>
    </section>
  </main>
  <footer class="container">2026-10-16 22:19</footer>
  <script>
    function openInstagram(username) {
		const webUrl = `https://www.instagram.com/${username}/`;
		const appUrl = `instagram://user?username=${username}`;
		let appOpened = false;

		const markAppOpened = () => {
			appOpened = true;
		};

		document.addEventListener('visibilitychange', markAppOpened, { once: true });
		window.addEventListener('blur', markAppOpened, { once: true });
		try {
			window.location.href = appUrl;
		} catch(e) {
			console.log('error:', e);
		}
		
      setTimeout(() => {
        if (!appOpened) window.location.href = webUrl;
      }, 1200);
    }

    function handleDubleTap(event, link) {
      event.preventDefault();

      const now = Date.now();
      const isDoubleTap = link.lastTap && now - link.lastTap < 400;

      clearTimeout(link.singleTapTimer);

      if (isDoubleTap) {
        link.lastTap = 0;
		if (link.href.includes('yume.potato')) {
			openInstagram('1nya0p1');
		} else if (link.href.includes('yume.kinoko')) {
			openInstagram('eaaasaz');
		}
        return false;
      }

      link.lastTap = now;
      link.singleTapTimer = setTimeout(() => {
        link.lastTap = 0;
        window.location.href = link.href;
      }, 400);
      return false;
    }
  </script>
</body>
</html>
